[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    error
    # pyrogram 2.0.106 (unmaintained since 2023) calls asyncio.get_event_loop()
    # at import time in pyrogram/sync.py:31; Python 3.12 deprecates that when no
    # loop is running. Third-party, not fixable here — scoped to that module so
    # our own DeprecationWarnings still fail the suite.
    ignore:There is no current event loop:DeprecationWarning:pyrogram.sync
